name: Docker Hub Tag Cleanup

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated image tags to delete from Docker Hub"
        required: true
        type: string

jobs:
  delete-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Delete tags via the Docker Hub API
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
        run: |
          JWT=$(curl -s -X POST -H "Content-Type: application/json" -d "{\"username\": \"$DH_USER\", \"password\": \"$DH_TOKEN\"}" https://hub.docker.com/v2/users/login/ | jq -r .token)
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then echo "Docker Hub login failed"; exit 1; fi
          for tag in $TAGS; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: JWT $JWT" "https://hub.docker.com/v2/repositories/$DH_USER/magic-resume/tags/$tag/")
            echo "DELETE $tag -> HTTP $code"
          done
